---
name: luv-coffee-be ci

on:
  push:
    branches:
      - main
  pull_request:

env:
  DOCKER_REPO: angularnestpostgre
  IMAGE_NAME: luv-coffee-be

jobs:
  build-image:
    name: Build Image

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REPO }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=true
          tags: |
            type=raw,value=0.0.20
            # type=raw,value=latest,enable=${{ endsWith(github.ref, github.event.repository.default_branch) }}
            # type=ref,event=pr
            # type=ref,event=branch
            # type=semver,pattern={{version}}

      - name: Docker Build and Run CI tests
        uses: docker/build-push-action@v6
        with:
          push: false
          tags: ${{ github.run_id }}
          target: ci

      - name: Run Trivy for all CVEs (non-blocking)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ github.run_id }}
          exit-code: 0
          format: table

      - name: Docker Build Image and Push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.event_name != 'pull_request' }}
          # tags: ${{ env.DOCKER_REPO }}/${{ env.IMAGE_NAME }}:latest,${{ env.DOCKER_REPO }}/${{ env.IMAGE_NAME }}:0.0.17
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          target: prod

