---
name: luv-coffee-be ci

on:
  push:
    branches:
      - main
  pull_request:

env:
  DOCKER_REPO: angularnestpostgre
  IMAGE_NAME: luv-coffee-be

jobs:
  build-test-image:
    name: Build Image for Testing

    runs-on: ubuntu-latest

    permissions:
      packages: write # needed to push docker image to ghcr.io

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push to GHCR
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ env.DOCKER_REPO }}/${{ env.IMAGE_NAME }}:${{ github.run_id }}
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64


  build-image:
    name: Build Image

    runs-on: ubuntu-latest

    permissions:
      contents: read # for actions/checkout to fetch code
      # actions: read # for github/codeql-action/upload-sarif
      # security-events: write # for github/codeql-action/upload-sarif to upload SARIF results

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REPO }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=true
          tags: |
            type=raw,value=0.0.22
            # type=raw,value=latest,enable=${{ endsWith(github.ref, github.event.repository.default_branch) }}
            # type=ref,event=pr
            # type=ref,event=branch
            # type=semver,pattern={{version}}

      - name: Docker Build and Run CI tests
        uses: docker/build-push-action@v6
        with:
          push: false
          tags: ${{ github.run_id }}
          target: ci

      - name: Run Trivy for all CVEs (non-blocking)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ github.run_id }}
          exit-code: 0
          format: table

      - name: Run Trivy for HIGH,CRITICAL CVEs and report (blocking)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ github.run_id }}
          exit-code: 1
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          # format: 'sarif'
          # output: 'trivy-results.sarif'

      # Requires Advanced Security which is avalabale only for public and GitHub Enterprise
      # - name: Upload Trivy scan results to GitHub Security tab
      #   uses: github/codeql-action/upload-sarif@v3
      #   if: always()
      #   with:
      #     sarif_file: 'trivy-results.sarif'

      - name: Docker Build Image and Push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.event_name != 'pull_request' }}
          # tags: ${{ env.DOCKER_REPO }}/${{ env.IMAGE_NAME }}:latest,${{ env.DOCKER_REPO }}/${{ env.IMAGE_NAME }}:0.0.17
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          target: prod

