---
name: luv-coffee-be ci

on:
  push:
    branches:
      - main
  pull_request:

env:
  DOCKER_REGISTRY: angularnestpostgre
  GHCR: ngnestpostgres
  IMAGE_NAME: luv-coffee-be

jobs:
  build-ci-image:
    name: Build Image for Testing
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # needed to push docker image to ghcr.io

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push to GHCR
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ env.GHCR }}/${{ env.IMAGE_NAME }}:${{ github.run_id }}
          target: ci
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
          platforms: linux/amd64

  ci-unit:
    name: CI in Docker
    needs: [build-ci-image]
    runs-on: ubuntu-latest

    permissions:
      packages: read

    steps:
      - name: Login to ghcr.io registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: docker run --rm ghcr.io/${{ env.GHCR }}/${{ env.IMAGE_NAME }}:${{ github.run_id }} npm run build

      - name: Lint
        run: docker run --rm ghcr.io/${{ env.GHCR }}/${{ env.IMAGE_NAME }}:${{ github.run_id }} npm run lint

      - name: Unit Tests
        run: docker run --rm ghcr.io/${{ env.GHCR }}/${{ env.IMAGE_NAME }}:${{ github.run_id }} npm test

  scan-image:
    name: Scan Image with Trivy
    needs: [build-ci-image]
    runs-on: ubuntu-latest

    permissions:
      actions: read # for github/codeql-action/upload-sarif
      contents: read # for actions/checkout to fetch code
      packages: read # needed to pull docker image to ghcr.io
      # security-events: write # for github/codeql-action/upload-sarif to upload SARIF results

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4

      - name: Login to ghcr.io registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image to scan
        run: docker pull ghcr.io/${{ env.GHCR }}/${{ env.IMAGE_NAME }}:${{ github.run_id }}

      - name: Run Trivy for all CVEs (non-blocking)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.GHCR }}/${{ env.IMAGE_NAME }}:${{ github.run_id }}
          exit-code: 0
          format: table

      - name: Run Trivy for HIGH,CRITICAL CVEs and report (blocking)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.GHCR }}/${{ env.IMAGE_NAME }}:${{ github.run_id }}
          exit-code: 1
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          # format: 'sarif'
          # output: 'trivy-results.sarif'

      # Requires Advanced Security which is avalabale only for public and GitHub Enterprise
      # - name: Upload Trivy scan results to GitHub Security tab
      #   uses: github/codeql-action/upload-sarif@v3
      #   if: always()
      #   with:
      #     sarif_file: 'trivy-results.sarif'

  build-prod-image:
    name: Build Prod Image
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push'}}
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=true
          tags: |
            type=raw,value=0.0.25
            # type=raw,value=latest,enable=${{ endsWith(github.ref, github.event.repository.default_branch) }}
            # type=ref,event=pr
            # type=ref,event=branch
            # type=semver,pattern={{version}}

      - name: Docker Build Image and Push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.event_name != 'pull_request' }}
          # tags: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest,${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:0.0.17
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          target: prod